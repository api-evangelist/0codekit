components:
  schemas:
    PostAiPdfocrRequest:
      type: object
      properties:
        pdfUrl:
          type: string
          description: PDF URL.
      required:
      - pdfUrl
    PostAiPdfocrResponse:
      type: object
      properties:
        '200':
          type: object
          description: Success response containing recognized text.
        recognizedText:
          type: string
          description: The text that was recognized in the PDF.
        '400':
          type: object
          description: Bad Request response.
        status:
          type: number
        errorMessage:
          type: string
    GetDocsResponse:
      type: object
      properties:
        '200':
          type: string
          description: Success
        '400':
          type: string
          description: Bad Request
    PostImageImageidRequest:
      type: object
      properties:
        url:
          type: string
          description: The image URL
        buffer:
          type: string
          description: The image as a Base64-encoded buffer. Can be specified instead of url.
        sigma:
          type: number
          description: 'How strongly the image will be blurred. Possible values: >= 0.3 and <= 1000'
        getAsUrl:
          type: boolean
          description: Whether the result image should be returned as a URL. Default is false.
        fileName:
          type: string
          description: The file name of the result image. Default is a random ID.
    PostImageImageidResponse:
      type: object
      properties:
        '200':
          type: string
          description: Success
        '400':
          type: string
          description: Bad Request
    GetMcpResponse:
      type: object
      properties:
