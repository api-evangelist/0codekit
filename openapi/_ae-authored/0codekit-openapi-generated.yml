          type: string
          description: Success
        '400':
          type: string
          description: Bad Request
    GetMcpListResponse:
      type: object
      properties:
        '200':
          type: string
          description: Success
        '400':
          type: string
          description: Bad Request
    PostMcpMcpidRequest:
      type: object
      properties:
        endpoint:
          type: string
        body:
          type: object
      required:
      - endpoint
      - body
    PostMcpMcpidResponse:
      type: object
      properties:
        '200':
          type: string
          description: Success
        '400':
          type: string
          description: Bad Request
    PostPdfPdfidRequest:
      type: object
      properties:
        url:
          type: string
          description: The PDF URL.
        buffer:
          type: string
          description: The PDF as a Base64-encoded buffer. Can be specified instead of url.
